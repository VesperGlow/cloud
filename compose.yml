services:
  cloud:
    image: "${CLOUD_IMAGE:-ghcr.io/vesperglow/cloud:latest}"
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ADDR: ":8080"
      APP_DATA_DIR: /data
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-http://localhost:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-cloud}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
      S3_PATH_STYLE: "true"
      PRESIGN_EXPIRES: "${PRESIGN_EXPIRES:-15m}"
      MULTIPART_THRESHOLD: "${MULTIPART_THRESHOLD:-104857600}"
      UPLOAD_EXPIRES: "${UPLOAD_EXPIRES:-24h}"
      PART_SIZE: "${PART_SIZE:-16777216}"
    volumes:
      - cloud-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
      S3_BUCKET: "${S3_BUCKET:-cloud}"
    volumes:
      - ./deploy/minio-cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 1; done &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}" &&
        mc cors set "local/$${S3_BUCKET}" /cors.json

volumes:
  cloud-data:
  minio-data:
